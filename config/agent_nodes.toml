[supervisor]
model = "gemini-2.5-flash"
provider = "google"
temperature = 0.7

[[nodes]]
name = "image_agent"
adapter = "python"
callable = "agents.image_agent:create_image_node"
callable_type = "factory"
model = "gemini-2.5-flash"
provider = "google"
temperature = 0.0
enabled = true

[[nodes]]
name = "audio_agent"
adapter = "python"
callable = "agents.audio_agent:create_audio_node"
callable_type = "factory"
model = "gemini-2.5-flash"
provider = "google"
temperature = 0.0
enabled = true

[[nodes]]
name = "video_agent"
adapter = "python"
callable = "agents.video_agent:create_video_node"
callable_type = "factory"
model = "gemini-2.5-flash"
provider = "google"
temperature = 0.0
enabled = true

[[nodes]]
name = "external_http_agent"
adapter = "http"
endpoint = "http://localhost:8080/infer"
method = "POST"
timeout_sec = 20
enabled = false

[[nodes]]
name = "external_mcp_agent"
adapter = "mcp"
mcp_command = "python"
mcp_args = ["-m", "my_mcp_server"]
mcp_tool = "run_agent"
timeout_sec = 20
enabled = false
